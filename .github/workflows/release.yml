name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  release-extension:
    name: Package and Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from manifest.json
      id: get_version
      run: |
        VERSION=$(node -p "require('./manifest.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Guard against shipping a secret
      run: |
        # A build is cheaper to fail than a leaked credential is to revoke.
        if grep -rniE "discord\.com/api/webhooks|hooks\.slack\.com/services" \
             manifest.json background.js content.js popup.js sidepanel.js utils.js; then
          echo "::error::Refusing to package: a webhook URL is present in the extension source."
          exit 1
        fi

    - name: Create extension zip
      run: |
        mkdir -p dist
        # Create a clean zip directly from selected files to avoid bloat
        # Ships only the extension runtime: no worker/, .agents/, or CI config.
        zip -r dist/clearconnect-${{ steps.get_version.outputs.tag }}.zip \
          manifest.json \
          background.js \
          content.js \
          popup.js \
          sidepanel.js \
          utils.js \
          popup.html \
          sidepanel.html \
          main.css \
          icons/ \
          LICENSE \
          README.md \
          CONTRIBUTING.md

    - name: Extract release notes
      id: extract_notes
      run: |
        # Take the top section of RELEASE_NOTES.md (the current version).
        NOTES=$(awk '/^## Version/{if(p) exit; p=1} p {if(/^---/) exit; print}' RELEASE_NOTES.md)
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "notes<<$EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.tag }}
        body: ${{ steps.extract_notes.outputs.notes }}
        draft: false
        prerelease: false
        files: dist/clearconnect-${{ steps.get_version.outputs.tag }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-worker:
    name: Test Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Worker tests
        working-directory: worker
        run: npm test

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: test-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
