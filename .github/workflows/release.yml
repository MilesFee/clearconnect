name: Build and Release Extension

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from manifest.json
      id: get_version
      run: |
        VERSION=$(node -p "require('./manifest.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Create extension zip
      run: |
        mkdir -p dist
        # Create a clean zip directly from selected files to avoid bloat
        # Ships only the extension runtime: no worker/, .agents/, or CI config.
        zip -r dist/clearconnect-${{ steps.get_version.outputs.tag }}.zip \
          manifest.json \
          background.js \
          content.js \
          popup.js \
          sidepanel.js \
          utils.js \
          popup.html \
          sidepanel.html \
          main.css \
          icons/ \
          LICENSE \
          README.md \
          CONTRIBUTING.md

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.tag }}
        body: |
          # ClearConnect ${{ steps.get_version.outputs.tag }}
          
          Release v${{ steps.get_version.outputs.version }} with enhanced statistics and persistence.
          
          See RELEASE_NOTES.md (if available) or the project dashboard for detailed changes.
        draft: false
        prerelease: false
        files: dist/clearconnect-${{ steps.get_version.outputs.tag }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
