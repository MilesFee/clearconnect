name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  release-extension:
    name: Package and Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from manifest.json
      id: get_version
      run: |
        VERSION=$(node -p "require('./manifest.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Create extension zip
      run: |
        mkdir -p dist
        # Create a clean zip directly from selected files to avoid bloat
        # Excludes: .git, .github, .agent, .gitignore, tests, etc.
        zip -r dist/clearconnect-${{ steps.get_version.outputs.tag }}.zip \
          manifest.json \
          background.js \
          content.js \
          popup.js \
          sidepanel.js \
          utils.js \
          popup.html \
          sidepanel.html \
          popup.css \
          icons/ \
          LICENSE \
          README.md \
          CONTRIBUTING.md

    - name: Extract Release Notes
      id: extract_notes
      run: |
        # Extract the top section of RELEASE_NOTES.md (current version)
        NOTES=$(awk '/^## Version/{if(p) exit; p=1} p {if(/^---/) exit; print}' RELEASE_NOTES.md)
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "notes<<$EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.tag }}
        body: ${{ steps.extract_notes.outputs.notes }}
        draft: false
        prerelease: false
        files: dist/clearconnect-${{ steps.get_version.outputs.tag }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: backend-selectors
